name: Animated GitHub profile — refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'profile.json'
      - 'package.json'
      - '.github/workflows/profile-art.yml'
permissions:
  contents: write
concurrency:
  group: animated-readme
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --omit=dev
      - name: Validate SVG generator
        run: npm test
      - name: Refresh real GitHub activity and ASCII portrait
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run refresh
      - name: Parse every generated SVG and verify LinkedIn
        run: python3 scripts/validate_svg.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh animated profile cards [skip ci]"
          git push
