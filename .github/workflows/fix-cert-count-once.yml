name: Fix certification group count once
on:
  push:
    paths:
      - '.github/workflows/fix-cert-count-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/Google \/ Cloud \/ Android · 12/Google \/ Cloud \/ Android · 15/' images/svg/cert-google.svg
          rm -f .github/workflows/fix-cert-count-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/svg/cert-google.svg .github/workflows/fix-cert-count-once.yml
          git commit -m "fix: correct Google certification count"
          git push
