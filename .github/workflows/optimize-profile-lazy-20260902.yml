name: Optimize profile lazy assets

on:
  push:
    paths:
      - '.github/workflows/optimize-profile-lazy-20260902.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lazy-load images inside collapsed sections
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('README.md'),
              Path('README_TR.md'),
              Path('README_DE.md'),
              Path('README_RU.md'),
              Path('README_ZH.md'),
          ]

          details_re = re.compile(r'<details(?P<attrs>[^>]*)>(?P<body>.*?)</details>', re.S | re.I)
          html_img_re = re.compile(r'<img\b(?![^>]*\bloading=)([^>]*)>', re.I)
          md_img_re = re.compile(r'!\[([^\]]*)\]\((https?://[^)]+)\)')

          def optimize_block(match):
              attrs = match.group('attrs')
              body = match.group('body')

              # Preserve every existing attribute/content; only add browser hints.
              body = html_img_re.sub(
                  lambda m: '<img loading="lazy" decoding="async"' + m.group(1) + '>',
                  body,
              )

              # Markdown images inside HTML/details can still be fetched eagerly.
              # Convert only simple image syntax, preserving alt text and URL.
              body = md_img_re.sub(
                  lambda m: '<img loading="lazy" decoding="async" src="{}" alt="{}" />'.format(
                      m.group(2).replace('&', '&amp;'),
                      m.group(1).replace('"', '&quot;'),
                  ),
                  body,
              )
              return '<details' + attrs + '>' + body + '</details>'

          changed = []
          for path in files:
              if not path.exists():
                  continue
              original = path.read_text(encoding='utf-8')
              updated = details_re.sub(optimize_block, original)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Optimized:', ', '.join(changed) if changed else 'no README changes needed')

      - name: Remove obsolete one-shot workflows
        run: |
          rm -f .github/workflows/fix-main-tech-badge-render.yml
          rm -f .github/workflows/sync-profile-layout.yml
          rm -f .github/workflows/optimize-profile-lazy-20260902.yml

      - name: Commit optimized profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_TR.md README_DE.md README_RU.md README_ZH.md .github/workflows
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "perf: lazy-load collapsed profile images"
          git push
