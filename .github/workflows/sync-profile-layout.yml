name: Sync profile layout

on:
  push:
    paths:
      - '.github/workflows/sync-profile-layout.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reposition snake and collapse translated sections
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [Path('README_TR.md'), Path('README_DE.md'), Path('README_RU.md'), Path('README_ZH.md')]

          snake = '''<p align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/yusufaliaskin/yusufaliaskin/output/github-contribution-grid-snake-dark.svg" />
              <source media="(prefers-color-scheme: light)" srcset="https://raw.githubusercontent.com/yusufaliaskin/yusufaliaskin/output/github-contribution-grid-snake.svg" />
              <img width="100%" alt="GitHub contribution snake" src="https://raw.githubusercontent.com/yusufaliaskin/yusufaliaskin/output/github-contribution-grid-snake.svg" />
            </picture>
          </p>'''

          snake_re = re.compile(
              r'<p align="center">\s*<picture>.*?github-contribution-grid-snake.*?</picture>\s*</p>',
              re.S,
          )

          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('<details open>', '<details>')
              text = snake_re.sub('', text)
              marker = '</p>\n\n<hr/>'
              if marker not in text:
                  raise RuntimeError(f'About/social marker not found in {path}')
              text = text.replace(marker, '</p>\n\n' + snake + '\n\n<hr/>', 1)
              text = re.sub(r'\n{3,}', '\n\n', text)
              path.write_text(text.rstrip() + '\n', encoding='utf-8')

      - name: Commit synchronized layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README_TR.md README_DE.md README_RU.md README_ZH.md
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "ui: sync snake placement and collapsed sections across languages"
          git push
