<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Yusuf Ali Aşkın animasyonlu kırmızı geliştirici başlığı"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070707"/><stop offset=".55" stop-color="#0d1117"/><stop offset="1" stop-color="#190307"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7f1d1d"/><stop offset=".5" stop-color="#ff2d2d"/><stop offset="1" stop-color="#ff6b6b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#ff2d2d" stroke-opacity=".055"/></pattern></defs><style>.branch{fill:none;stroke:url(#red);stroke-width:4;stroke-linecap:round;stroke-dasharray:450;stroke-dashoffset:450;animation:draw 4.8s ease-in-out infinite alternate}.b2{animation-delay:.5s}.b3{animation-delay:1s}.node{fill:#ff2d2d;filter:url(#glow);animation:pulse 1.8s ease-in-out infinite alternate}.n2{animation-delay:.4s}.n3{animation-delay:.8s}.wave{animation:slide 8s linear infinite}.wave2{animation:slide 12s linear infinite reverse;opacity:.35}.scan{animation:scan 5s linear infinite}.cursor{animation:blink .8s steps(2,end) infinite}.label{animation:fade 4s ease-in-out infinite alternate}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pulse{to{r:9;opacity:.45}}@keyframes slide{to{transform:translateX(-300px)}}@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(360px)}}@keyframes blink{50%{opacity:0}}@keyframes fade{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="320" rx="20" fill="url(#bg)"/><rect width="1200" height="320" rx="20" fill="url(#grid)"/><rect class="scan" width="1200" height="2" fill="#ff2d2d" opacity=".25"/><g font-family="monospace"><text x="55" y="74" fill="#8b949e" font-size="18">yusuf@github:~$</text><text x="235" y="74" fill="#ff4d4d" font-size="18">whoami</text><text x="55" y="118" fill="#f0f6fc" font-size="38" font-weight="700">YUSUF ALI AŞKIN</text><text x="55" y="156" fill="#ff6b6b" font-size="19">YAPAY ZEKA • YAZILIM • SİBER GÜVENLİK • OTOMASYON</text><text x="55" y="204" fill="#8b949e" font-size="17">Güvenli sistemler kur. Karmaşıklığı otomatikleştir. Sağlam yazılım üret.</text><text x="55" y="247" fill="#8b949e" font-size="17">durum:</text><text x="125" y="247" fill="#ff2d2d" font-size="17">ÇEVRİMİÇİ</text><rect class="cursor" x="220" y="231" width="10" height="20" fill="#ff2d2d"/></g><g transform="translate(780 20)"><path class="branch" d="M190 275C185 220 195 188 184 152C170 108 130 88 92 55"/><path class="branch b2" d="M185 168C230 145 254 112 270 70M176 137C142 125 121 103 108 78M196 205C236 202 272 185 304 157"/><path class="branch b3" d="M113 83L70 73M135 111L105 135M244 116L294 105M270 188L320 204M203 150L229 119"/><circle class="node" cx="92" cy="55" r="6"/><circle class="node n2" cx="70" cy="73" r="6"/><circle class="node n3" cx="108" cy="78" r="6"/><circle class="node n2" cx="270" cy="70" r="6"/><circle class="node" cx="294" cy="105" r="6"/><circle class="node n3" cx="320" cy="204" r="6"/><circle class="node n2" cx="304" cy="157" r="6"/></g><g opacity=".45"><path class="wave" d="M0 295C120 260 180 320 300 290S500 265 600 295S780 320 900 285S1100 270 1300 295" fill="none" stroke="#ff2d2d" stroke-width="3"/><path class="wave2" d="M0 306C120 275 200 325 330 302S520 275 650 303S820 326 960 294S1160 278 1400 303" fill="none" stroke="#ff6b6b" stroke-width="2"/></g></svg>