<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Yusuf Ali Aşkın — animated developer profile banner</title>
  <desc id="desc">A dark terminal interface beside an animated neon circuit tree representing AI, software engineering, cybersecurity and automation.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="52%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#07110e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="1" x2="0.7" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="52%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#7d8590" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1000" cy="145" r="235" fill="url(#orb)">
    <animate attributeName="opacity" values=".55;.95;.55" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="42" cy="35" r="6" fill="#ff5f56"/>
    <circle cx="62" cy="35" r="6" fill="#ffbd2e"/>
    <circle cx="82" cy="35" r="6" fill="#27c93f"/>
    <text x="105" y="40" fill="#7d8590" font-size="14">yusuf@github:~</text>
    <text x="1060" y="40" fill="#3fb950" font-size="13">● ONLINE</text>
  </g>

  <g transform="translate(55 78)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="0" y="0" width="610" height="285" rx="18" fill="#0d1117" fill-opacity=".82" stroke="#30363d"/>
    <rect x="0" y="0" width="610" height="38" rx="18" fill="#161b22"/>
    <path d="M0 38H610" stroke="#30363d"/>

    <text x="28" y="82" fill="#7ee787" font-size="17">$</text>
    <text x="51" y="82" fill="#c9d1d9" font-size="17">whoami</text>

    <g opacity="0">
      <text x="28" y="118" fill="#58a6ff" font-size="25" font-weight="700">YUSUF ALI AŞKIN</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.12;.14;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="28" y="156" fill="#7ee787" font-size="17">$</text>
      <text x="51" y="156" fill="#c9d1d9" font-size="17">cat focus.txt</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.25;.27;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="28" y="194" fill="#d2a8ff" font-size="16">AI Systems · Software Engineering</text>
      <text x="28" y="221" fill="#79c0ff" font-size="16">Cybersecurity · Automation · Infrastructure</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.42;.44;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <g opacity="0">
      <text x="28" y="261" fill="#7ee787" font-size="17">$</text>
      <text x="51" y="261" fill="#c9d1d9" font-size="17">build --secure --automate --iterate</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.58;.60;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <rect x="392" y="246" width="10" height="20" rx="1" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(730 54)">
    <ellipse cx="230" cy="326" rx="175" ry="22" fill="#2dd4bf" opacity=".08">
      <animate attributeName="rx" values="150;185;150" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".05;.12;.05" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="none" stroke="url(#tree)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)">
      <path d="M230 305 C204 320 176 326 137 331" stroke-dasharray="140" stroke-dashoffset="140"><animate attributeName="stroke-dashoffset" from="140" to="0" dur="1.6s" fill="freeze"/></path>
      <path d="M230 305 C254 318 286 324 335 330" stroke-dasharray="150" stroke-dashoffset="150"><animate attributeName="stroke-dashoffset" from="150" to="0" dur="1.6s" begin=".15s" fill="freeze"/></path>
      <path d="M230 307 C227 326 224 337 218 345" stroke-dasharray="70" stroke-dashoffset="70"><animate attributeName="stroke-dashoffset" from="70" to="0" dur="1.2s" begin=".3s" fill="freeze"/></path>
    </g>

    <g fill="none" stroke="url(#tree)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M230 307 C226 260 240 230 230 191 C219 151 226 116 230 71" stroke-width="9" stroke-dasharray="280" stroke-dashoffset="280"><animate attributeName="stroke-dashoffset" from="280" to="0" dur="2.2s" fill="freeze"/></path>
      <path d="M229 238 C198 225 171 205 148 176 C127 151 116 126 104 99" stroke-width="5" stroke-dasharray="220" stroke-dashoffset="220"><animate attributeName="stroke-dashoffset" from="220" to="0" dur="1.8s" begin=".8s" fill="freeze"/></path>
      <path d="M229 215 C266 203 294 179 319 150 C336 130 348 108 361 78" stroke-width="5" stroke-dasharray="230" stroke-dashoffset="230"><animate attributeName="stroke-dashoffset" from="230" to="0" dur="1.8s" begin=".9s" fill="freeze"/></path>
      <path d="M226 178 C198 163 180 143 168 118 C158 99 151 80 149 57" stroke-width="4" stroke-dasharray="170" stroke-dashoffset="170"><animate attributeName="stroke-dashoffset" from="170" to="0" dur="1.5s" begin="1.2s" fill="freeze"/></path>
      <path d="M232 160 C260 145 278 122 290 101 C301 81 305 62 307 42" stroke-width="4" stroke-dasharray="170" stroke-dashoffset="170"><animate attributeName="stroke-dashoffset" from="170" to="0" dur="1.5s" begin="1.25s" fill="freeze"/></path>
      <path d="M151 177 C118 179 92 171 64 154" stroke-width="3" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" from="120" to="0" dur="1.2s" begin="1.6s" fill="freeze"/></path>
      <path d="M319 150 C349 156 378 150 401 134" stroke-width="3" stroke-dasharray="120" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" from="120" to="0" dur="1.2s" begin="1.6s" fill="freeze"/></path>
    </g>

    <g fill="none" stroke="#58a6ff" stroke-width="1.6" opacity=".72">
      <path d="M105 100H70V77H43"/><path d="M149 58V29H119"/><path d="M307 43V21H340"/><path d="M361 79H395V53H421"/><path d="M64 154H35V175H13"/><path d="M401 134H430V112H450"/>
    </g>

    <g fill="#0d1117" stroke-width="2.2" filter="url(#softGlow)">
      <g stroke="#58a6ff">
        <circle cx="43" cy="77" r="7"><animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="119" cy="29" r="7"><animate attributeName="r" values="7;10;7" dur="2.8s" begin=".4s" repeatCount="indefinite"/></circle>
        <circle cx="340" cy="21" r="7"><animate attributeName="r" values="6;9;6" dur="2.5s" begin=".8s" repeatCount="indefinite"/></circle>
      </g>
      <g stroke="#2dd4bf">
        <circle cx="421" cy="53" r="7"><animate attributeName="r" values="7;10;7" dur="2.7s" begin=".2s" repeatCount="indefinite"/></circle>
        <circle cx="13" cy="175" r="7"><animate attributeName="r" values="6;9;6" dur="2.2s" begin=".6s" repeatCount="indefinite"/></circle>
        <circle cx="450" cy="112" r="7"><animate attributeName="r" values="7;10;7" dur="2.9s" begin=".3s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <g fill="#fff" filter="url(#glow)">
      <circle r="3"><animateMotion dur="4.2s" repeatCount="indefinite" path="M230 306 C226 260 240 230 230 191 C219 151 226 116 230 71"/></circle>
      <circle r="2.6" fill="#7ee787"><animateMotion dur="5s" begin=".8s" repeatCount="indefinite" path="M229 238 C198 225 171 205 148 176 C127 151 116 126 104 99"/></circle>
      <circle r="2.6" fill="#79c0ff"><animateMotion dur="4.7s" begin="1.3s" repeatCount="indefinite" path="M229 215 C266 203 294 179 319 150 C336 130 348 108 361 78"/></circle>
    </g>

    <g fill="#58a6ff" opacity=".55">
      <circle cx="75" cy="230" r="2"><animate attributeName="cy" values="230;210;230" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="385" cy="230" r="2.5"><animate attributeName="cy" values="230;198;230" dur="5s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="95" cy="45" r="1.8"><animate attributeName="cy" values="45;25;45" dur="3.7s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="372" cy="28" r="1.8"><animate attributeName="cy" values="28;10;28" dur="4.4s" begin=".9s" repeatCount="indefinite"/></circle>
    </g>

    <text x="230" y="372" text-anchor="middle" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">ROOT → BUILD → SECURE → SCALE</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".28"/>
</svg>