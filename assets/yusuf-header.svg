<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.52" stop-color="#101923"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="110" y1="58" x2="1010" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3FB950"/>
      <stop offset="0.48" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#30363D" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" stroke="#30363D" stroke-width="2"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>

  <circle cx="1040" cy="48" r="145" fill="#238636" opacity="0.07"/>
  <circle cx="1090" cy="275" r="190" fill="#1F6FEB" opacity="0.07"/>
  <circle cx="900" cy="315" r="135" fill="#8957E5" opacity="0.06"/>

  <g opacity="0.92">
    <rect x="74" y="55" width="9" height="210" rx="4.5" fill="url(#accent)"/>
    <circle cx="78.5" cy="67" r="14" stroke="#3FB950" stroke-width="2" opacity="0.38"/>
