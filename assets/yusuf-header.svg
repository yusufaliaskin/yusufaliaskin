    <rect width="225" height="34" rx="14" fill="#161B22"/>
    <path d="M0 34H225" stroke="#30363D"/>
    <circle cx="20" cy="17" r="5" fill="#FF7B72"/>
    <circle cx="38" cy="17" r="5" fill="#D29922"/>
    <circle cx="56" cy="17" r="5" fill="#3FB950"/>
    <text x="18" y="65" fill="#3FB950" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">$ whoami</text>
    <text x="18" y="90" fill="#F0F6FC" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">yusufaliaskin</text>
    <text x="18" y="116" fill="#58A6FF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">$ focus</text>
