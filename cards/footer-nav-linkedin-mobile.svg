<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 53" width="90" height="53" role="img" aria-label="LinkedIn button — https://www.linkedin.com/in/yusufaliaskin/"><title>LinkedIn button — https://www.linkedin.com/in/yusufaliaskin/</title><style><![CDATA[
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
