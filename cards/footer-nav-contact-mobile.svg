<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 32" width="90" height="32" role="img" aria-label="contact — mailto:yusufaliaskin@gmail.com"><title>contact — mailto:yusufaliaskin@gmail.com</title><style><![CDATA[
@keyframes rise{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes tilein{from{opacity:0;transform:translateY(17px) scale(.985)}to{opacity:1;transform:none}}
@keyframes barin{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes nudge{from{opacity:.4;transform:translateX(-3px)}to{opacity:1;transform:none}}
@keyframes nudgeup{from{opacity:.4;transform:translate(-3px,3px)}to{opacity:1;transform:none}}
@keyframes sheen{from{transform:translateX(-260px) skewX(-18deg)}to{transform:translateX(440px) skewX(-18deg)}}
@keyframes ring{from{opacity:.55;transform:scale(.7)}to{opacity:0;transform:scale(1.2)}}
@keyframes draw{from{transform:scaleX(0);opacity:.2}to{transform:scaleX(1);opacity:1}}
.r{opacity:0;animation:rise .67s cubic-bezier(.22,1,.36,1) forwards}
.f{opacity:0;animation:fade .55s ease-out forwards}
.ti{opacity:0;animation:tilein .8s cubic-bezier(.22,1,.36,1) forwards;transform-box:fill-box;transform-origin:center}
.ba{animation:barin .7s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center bottom}
.nu{animation:nudge .65s ease-out both}
.nup{animation:nudgeup .65s ease-out both}
.li{animation:pulse 1.5s ease-in-out 2}
.sh{animation:sheen 1.25s ease-out 1s 1 forwards}
.rg{animation:ring 1.5s ease-out 1s 1 forwards;transform-box:fill-box;transform-origin:center}
.draw{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;animation:draw .56s cubic-bezier(.22,1,.36,1) forwards}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}}
]]></style><rect x="0" y="0" width="87" height="29" rx="6" fill="#f3f3f1" /><text x="6" y="21" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#111111" class="r" style="animation-delay:0.60s">contact</text><text x="81" y="21" font-family="Consolas, Menlo, monospace" font-size="10" fill="#2f55ff" text-anchor="end" class="nup" style="animation-delay:0.73s">↗</text><rect x="6" y="25" width="27" height="1.7" rx="1" fill="#2f55ff" class="draw" style="animation-delay:0.79s"/></svg>