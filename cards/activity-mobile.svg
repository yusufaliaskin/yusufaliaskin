<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 131" width="360" height="131" role="img" aria-label="Mobile activity 117 contributions"><title>Mobile activity 117 contributions</title><style><![CDATA[
@keyframes rise{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}
