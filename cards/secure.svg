<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 293.3333333333333 222" width="293.3333333333333" height="222" role="img" aria-label="SECURE AI"><title>SECURE AI</title><style><![CDATA[@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
@keyframes nudgeup{0%,100%{transform:none}50%{transform:translate(3px,-3px)}}
@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-10px) scale(1.05) rotate(2deg)}75%{transform:translateY(3px) scale(.98) rotate(-.8deg)}90%{transform:translateY(-1px) scale(1.01) rotate(.2deg)}100%{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes arrowin{0%{opacity:0;transform:translateX(-30px)}60%{opacity:1;transform:translateX(6px)}100%{opacity:1;transform:none}}
@keyframes roll{from{transform:translateY(60px)}to{transform:none}}
@keyframes sheen{0%{transform:translateX(-260px) skewX(-20deg)}22%,100%{transform:translateX(420px) skewX(-20deg)}}
@keyframes ring{0%{opacity:.7;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .9s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s ease-out both}
.live{animation:pulse 1.6s ease-in-out infinite}
.n{transform-box:fill-box;animation:nudge 1.8s ease-in-out infinite}
.nu{transform-box:fill-box;animation:nudgeup 1.8s ease-in-out infinite}
.ti{opacity:0;transform-box:fill-box;transform-origin:50% 60%;animation:tilein 1.1s cubic-bezier(.2,.8,.2,1) both}
.sl{opacity:0;transform-box:fill-box;animation:slidein .6s cubic-bezier(.2,.7,.2,1) both}
.ai{opacity:0;transform-box:fill-box;animation:arrowin .7s cubic-bezier(.2,.7,.2,1) both}
.ro{transform-box:fill-box;animation:roll .8s cubic-bezier(.15,.8,.2,1) both}
.sh{animation:sheen 5s ease-in-out infinite}
.rg{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 1s ease-out both}
@media(prefers-reduced-motion:reduce){.r,.f,.g,.p,.live,.n,.nu,.ti,.sl,.ai,.ro,.sh,.rg{animation:none!important;opacity:1!important;transform:none!important}.sh,.rg{display:none!important}}

@keyframes buttonIn{0%{opacity:0;transform:translateY(18px) scale(.87)}65%{opacity:1;transform:translateY(-1px) scale(1.025)}100%{opacity:1;transform:none}}
@media(max-width:400px){.sh,.n,.nu,.live{animation-iteration-count:2!important}}
]]></style><defs><clipPath id="card"><rect x="4" y="0" width="285.3333333333333" height="210" rx="14" fill="#fff" /></clipPath><clipPath id="slot"><rect x="4" y="62" width="285.3333333333333" height="62" rx="0" fill="#fff" /></clipPath><linearGradient id="gl"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g class="ti" style="animation-delay:3.35s"><g clip-path="url(#card)"><rect x="4" y="0" width="285.3333333333333" height="210" rx="14" fill="#ef3b2d" /><circle class="rg" style="animation-delay:3.85s" cx="249.33333333333331" cy="170" r="60" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><rect x="4" y="-20" width="90" height="250" rx="0" fill="url(#gl)" class="sh" style="animation-delay:4.75s"/></g><text x="28" y="38" font-family="Consolas, Menlo, monospace" font-size="12" fill="#fff" class="sl" style="animation-delay:3.70s">SECURE</text><g class="ai" style="animation-delay:3.85s"><text x="255" y="38" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff" class="n">→</text></g><g clip-path="url(#slot)"><g class="ro" style="animation-delay:3.80s"><text x="26" y="112" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="46" font-style="italic" fill="#fff" class="r" style="animation-delay:3.8000000000000003s">AI <tspan font-size="18">+ security</tspan></text></g></g><text x="28" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" class="r" style="animation-delay:4.10s">Practical security, automation and</text><text x="28" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fff" class="r" style="animation-delay:4.20s">systems engineering.</text></g></svg>