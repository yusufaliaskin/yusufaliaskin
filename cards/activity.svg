<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-label="Activity data is not available until first sync"><title>Activity data is not available until first sync</title><style><![CDATA[
@keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-11px) scale(1.045) rotate(2deg)}75%{transform:translateY(3px) scale(.98) rotate(-.8deg)}100%{opacity:1;transform:none}}
@keyframes barin{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(5px)}}
@keyframes nudgeup{0%,100%{transform:none}50%{transform:translate(3px,-3px)}}
@keyframes sheen{0%,10%{transform:translateX(-270px) skewX(-18deg)}48%,100%{transform:translateX(450px) skewX(-18deg)}}
@keyframes ring{0%{opacity:.8;transform:scale(.25)}100%{opacity:0;transform:scale(2.25)}}
@keyframes rotatein{0%{opacity:0;transform:translateX(-20px) rotate(-4deg)}100%{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.r{opacity:0;animation:rise .82s cubic-bezier(.18,.8,.23,1) forwards}
.f{opacity:0;animation:fade .72s ease forwards}
.ti{opacity:0;animation:tilein 1.1s cubic-bezier(.19,.9,.23,1) forwards;transform-origin:center center}
.ba{animation:barin .8s cubic-bezier(.18,.9,.27,1) both;transform-box:fill-box;transform-origin:center bottom}
.nu{animation:nudge 1.8s ease-in-out infinite}
.nup{animation:nudgeup 2s ease-in-out infinite}
.li{animation:pulse 1.6s ease-in-out infinite}
.sh{animation:sheen 5s cubic-bezier(.45,0,.55,1) 1.6s infinite}
.rg{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.fl{animation:float 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}}
]]></style><rect x="0" y="0" width="880" height="340" rx="14" fill="#f3f3f1" /><text x="42" y="57" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e6e73" letter-spacing="1" class="f" style="animation-delay:.15s">THE LAST 12 MONTHS ON GITHUB</text><text x="41" y="122" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="51" fill="#111111" font-style="italic" class="r" style="animation-delay:.2s">Syncing real activity</text><text x="43" y="163" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3a3a3c" >Real numbers appear after the first scheduled refresh.</text><rect x="45" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="91" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="137" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="183" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="229" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="275" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="321" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="367" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="413" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="459" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="505" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><rect x="551" y="261" width="24" height="26" rx="4" fill="#e2e2de" class="ba"/><text x="652" y="140" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="42" fill="#111111" >—</text><text x="652" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6e6e73" >current streak</text><text x="652" y="230" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="42" fill="#111111" >—</text><text x="652" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6e6e73" >busiest day</text></svg>