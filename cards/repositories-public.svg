<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 54" width="880" height="54" role="img" aria-label="public: 12 repositories"><title>public: 12 repositories</title><style><![CDATA[
@keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-11px) scale(1.045) rotate(2deg)}75%{transform:translateY(3px) scale(.98) rotate(-.8deg)}100%{opacity:1;transform:none}}
@keyframes barin{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(5px)}}
@keyframes nudgeup{0%,100%{transform:none}50%{transform:translate(3px,-3px)}}
@keyframes sheen{0%,10%{transform:translateX(-270px) skewX(-18deg)}48%,100%{transform:translateX(450px) skewX(-18deg)}}
@keyframes ring{0%{opacity:.8;transform:scale(.25)}100%{opacity:0;transform:scale(2.25)}}
@keyframes rotatein{0%{opacity:0;transform:translateX(-20px) rotate(-4deg)}100%{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.12}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.r{opacity:0;animation:rise .82s cubic-bezier(.18,.8,.23,1) forwards}
.f{opacity:0;animation:fade .72s ease forwards}
.ti{opacity:0;animation:tilein 1.1s cubic-bezier(.19,.9,.23,1) forwards;transform-origin:center center}
.ba{animation:barin .8s cubic-bezier(.18,.9,.27,1) both;transform-box:fill-box;transform-origin:center bottom}
.nu{animation:nudge 1.2s ease-in-out 1}
.nup{animation:nudgeup 1.2s ease-in-out 1}
.li{animation:pulse 1.6s ease-in-out 2}
.sh{animation:sheen 1.5s ease-out 1.2s 1}
.rg{animation:ring 1.5s ease-out 1;transform-box:fill-box;transform-origin:center}
.fl{animation:float 2.5s ease-in-out 2}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}}
]]></style><rect x="0" y="0" width="880" height="51" rx="10" fill="#f3f3f1" /><rect x="25" y="17" width="7" height="7" rx="2" fill="#2f55ff" /><text x="44" y="29" font-family="Consolas, Menlo, monospace" font-size="14" fill="#111111" font-weight="600" letter-spacing=".75">PUBLIC REPOSITORIES</text><text x="850" y="30" font-family="Consolas, Menlo, monospace" font-size="17" fill="#2f55ff" text-anchor="end">12</text></svg>