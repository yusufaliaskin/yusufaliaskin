<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 38" width="360" height="38" role="img" aria-label="Animated mobile coding section"><title>Animated mobile coding section</title><style><![CDATA[
@keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes tilein{0%{opacity:0;transform:translateY(16px) scale(.985)}100%{opacity:1;transform:none}}
@keyframes barin{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes linein{0%{opacity:.25;transform:scaleX(0)}100%{opacity:1;transform:scaleX(1)}}
@keyframes shine{0%{transform:translateX(-220px) skewX(-18deg)}100%{transform:translateX(270px) skewX(-18deg)}}
@keyframes glow{0%{opacity:0}35%{opacity:.55}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes nudge{0%{opacity:0;transform:translateX(-5px)}100%{opacity:1;transform:none}}
@keyframes nudgeup{0%{opacity:0;transform:translate(-3px,4px)}100%{opacity:1;transform:none}}
@keyframes sheen{0%{transform:translateX(-270px) skewX(-18deg)}100%{transform:translateX(460px) skewX(-18deg)}}
@keyframes ring{0%{opacity:.5;transform:scale(.65)}100%{opacity:0;transform:scale(1.35)}}
@keyframes draw{0%{transform:scaleX(0);opacity:.3}100%{transform:scaleX(1);opacity:1}}
.r,.btn-reveal,.repo-reveal,.lang-pill-reveal,.portrait-reveal{opacity:0;animation:rise .72s cubic-bezier(.22,1,.36,1) forwards}
.f{opacity:0;animation:fade .58s ease-out forwards}
.ti{opacity:0;animation:tilein .83s cubic-bezier(.22,1,.36,1) forwards;transform-box:fill-box;transform-origin:center}
.ba{animation:barin .77s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center bottom}
.heat-col{opacity:0;animation:rise .46s cubic-bezier(.22,1,.36,1) forwards}
.nav-border-reveal,.line-draw{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;animation:linein .66s cubic-bezier(.22,1,.36,1) forwards}
.shine{animation:shine 1.25s ease-in-out 1 forwards}
.soft-glow{animation:glow 1.2s ease-out 1 forwards}
.nu{animation:nudge .66s ease-out both}
.nup{animation:nudgeup .66s ease-out both}
.li{animation:pulse 1.6s ease-in-out 2}
.sh{animation:sheen 1.25s ease-out .8s 1 forwards}
.rg{animation:ring 1.25s ease-out .8s 1 forwards;transform-box:fill-box;transform-origin:center}
.draw{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;animation:draw .55s cubic-bezier(.22,1,.36,1) forwards}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}}
]]></style><text x="9" y="29" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="23" fill="#111111" class="r" style="animation-delay:.15s">What I&apos;m</text><text x="122" y="29" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="23" fill="#111111" font-style="italic" class="r" style="animation-delay:.35s">coding</text></svg>